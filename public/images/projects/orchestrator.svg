<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  <!-- Nodes & Mesh -->
  <g stroke="#4338ca" stroke-width="2" opacity="0.6">
    <line x1="200" y1="250" x2="400" y2="150" />
    <line x1="200" y1="250" x2="400" y2="350" />
    <line x1="400" y1="150" x2="600" y2="250" />
    <line x1="400" y1="350" x2="600" y2="250" />
    <line x1="400" y1="150" x2="400" y2="350" />
  </g>
  <!-- Cluster boxes -->
  <rect x="140" y="210" width="120" height="80" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="160" y="255" fill="#e0e7ff" font-family="monospace" font-size="14 font-weight="bold">edge-node</text>

  <rect x="340" y="110" width="120" height="80" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
  <text x="360" y="155" fill="#e0e7ff" font-family="monospace" font-size="14 font-weight="bold">daemon-01</text>

  <rect x="340" y="310" width="120" height="80" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
  <text x="360" y="355" fill="#e0e7ff" font-family="monospace" font-size="14 font-weight="bold">daemon-02</text>

  <rect x="540" y="210" width="120" height="80" rx="8" fill="#1e293b" stroke="#a5b4fc" stroke-width="2"/>
  <text x="560" y="255" fill="#e0e7ff" font-family="monospace" font-size="14 font-weight="bold">rpc-mesh</text>

  <text x="100" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="700" font-size="22">Distributed Cluster Orchestration</text>
  <text x="100" y="105" fill="#a5b4fc" font-family="monospace" font-size="14">Multi-Region Preview Pipelines</text>
</svg>
